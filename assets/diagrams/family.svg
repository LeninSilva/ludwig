<svg class="dg" viewBox="0 0 360 210" role="img" aria-label="Games overlap like family members: neighbours share features, but no single feature runs through all" xmlns="http://www.w3.org/2000/svg"><title>Games overlap like family members: neighbours share features, but no single feature runs through all</title><defs><marker id="family-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><circle cx="50" cy="85" r="50" class="b"/><text x="50" y="60" class="tp" text-anchor="middle">Chess</text><text x="50" y="92" class="s" text-anchor="middle">compete</text><text x="50" y="107" class="s" text-anchor="middle">rules</text><text x="50" y="122" class="s" text-anchor="middle">skill</text><circle cx="130" cy="85" r="50" class="b"/><text x="130" y="60" class="tp" text-anchor="middle">Solitaire</text><text x="130" y="92" class="s" text-anchor="middle">rules</text><text x="130" y="107" class="s" text-anchor="middle">skill</text><text x="130" y="122" class="s" text-anchor="middle">fun</text><circle cx="210" cy="85" r="50" class="b"/><text x="210" y="60" class="tp" text-anchor="middle">Catch</text><text x="210" y="92" class="s" text-anchor="middle">skill</text><text x="210" y="107" class="s" text-anchor="middle">fun</text><circle cx="290" cy="85" r="50" class="b"/><text x="290" y="60" class="tp" text-anchor="middle">Make-</text><text x="290" y="75" class="tp" text-anchor="middle">believe</text><text x="290" y="100" class="s" text-anchor="middle">fun</text><path d="M10 165c80-20 120 20 170 0s100-20 170 0" class="c"/><path d="M10 172c80-20 120 20 170 0s100-20 170 0" class="c"/><text x="180" y="200" class="t" text-anchor="middle">No thread runs the whole length. The rope holds.</text></svg>
