<svg class="dg" viewBox="0 0 360 210" role="img" aria-label="A circle of what can be said, its edge only shown; and a ladder to climb up and then throw away" xmlns="http://www.w3.org/2000/svg"><title>A circle of what can be said, its edge only shown; and a ladder to climb up and then throw away</title><defs><marker id="limits-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><circle cx="120" cy="105" r="75" class="b"/><text x="120" y="100" class="tp" text-anchor="middle">What can be</text><text x="120" y="116" class="tp" text-anchor="middle">said (facts)</text><text x="120" y="200" class="s" text-anchor="middle">The edge is shown, not said</text><path d="M262 190 300 30M292 190 330 30" class="k"/><line x1="268.5625" y1="175" x2="298.5625" y2="175" class="k"/><line x1="274.975" y1="148" x2="304.975" y2="148" class="k"/><line x1="281.3875" y1="121" x2="311.3875" y2="121" class="k"/><line x1="287.8" y1="94" x2="317.8" y2="94" class="k"/><line x1="294.2125" y1="67" x2="324.2125" y2="67" class="k"/><line x1="300.625" y1="40" x2="330.625" y2="40" class="k"/><text x="300" y="18" class="tc" text-anchor="middle">climb, then let go</text><line x1="205" y1="105" x2="255" y2="105" class="k" stroke-dasharray="4 4" marker-end="url(#limits-ar)"/></svg>
