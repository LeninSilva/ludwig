<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="Relative value can be measured; absolute value is not another measurable fact" xmlns="http://www.w3.org/2000/svg"><title>Relative value can be measured; absolute value is not another measurable fact</title><defs><marker id="ethics-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="22" class="lab" text-anchor="middle">RELATIVE VALUE</text><text x="270" y="22" class="lab" text-anchor="middle">ABSOLUTE VALUE</text><rect x="20" y="35" width="140" height="100" rx="8" class="b"/><line x1="35" y1="110" x2="145" y2="110" class="p"/><line x1="35" y1="110" x2="35" y2="98" class="p"/><line x1="45" y1="110" x2="45" y2="104" class="p"/><line x1="55" y1="110" x2="55" y2="104" class="p"/><line x1="65" y1="110" x2="65" y2="104" class="p"/><line x1="75" y1="110" x2="75" y2="104" class="p"/><line x1="85" y1="110" x2="85" y2="98" class="p"/><line x1="95" y1="110" x2="95" y2="104" class="p"/><line x1="105" y1="110" x2="105" y2="104" class="p"/><line x1="115" y1="110" x2="115" y2="104" class="p"/><line x1="125" y1="110" x2="125" y2="104" class="p"/><line x1="135" y1="110" x2="135" y2="98" class="p"/><line x1="145" y1="110" x2="145" y2="104" class="p"/><text x="90" y="70" class="t" text-anchor="middle">“a good runner”</text><text x="90" y="128" class="s" text-anchor="middle">measurable: 11 seconds</text><rect x="200" y="35" width="140" height="100" rx="8" class="bc"/><text x="270" y="70" class="t" text-anchor="middle">“a good life”</text><text x="270" y="98" class="big" text-anchor="middle">?</text><text x="270" y="128" class="s" text-anchor="middle">no ruler fits</text><text x="180" y="160" class="tp" text-anchor="middle">Good FOR something: a fact you can check.</text><text x="180" y="178" class="tc" text-anchor="middle">Good, full stop: not one more fact in the world.</text></svg>
