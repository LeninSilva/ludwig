<svg class="dg" viewBox="0 0 360 210" role="img" aria-label="A public word can be corrected by others; a purely private sign has no check" xmlns="http://www.w3.org/2000/svg"><title>A public word can be corrected by others; a purely private sign has no check</title><defs><marker id="private-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="22" class="lab" text-anchor="middle">PUBLIC WORD</text><text x="270" y="22" class="lab" text-anchor="middle">PRIVATE SIGN</text><rect x="20" y="35" width="140" height="110" rx="8" class="b"/><text x="90" y="65" class="tp" text-anchor="middle">“pain”</text><text x="90" y="88" class="s" text-anchor="middle">others see: wince,</text><text x="90" y="102" class="s" text-anchor="middle">injury, comforting</text><text x="90" y="128" class="t" text-anchor="middle">can be corrected ✓</text><rect x="200" y="35" width="140" height="110" rx="8" class="bc"/><rect x="212" y="55" width="20" height="20" rx="3" class="b"/><text x="222.0" y="69.5" class="tc" text-anchor="middle">S</text><rect x="237" y="55" width="20" height="20" rx="3" class="b"/><rect x="262" y="55" width="20" height="20" rx="3" class="b"/><text x="272.0" y="69.5" class="tc" text-anchor="middle">S</text><rect x="287" y="55" width="20" height="20" rx="3" class="b"/><text x="297.0" y="69.5" class="tc" text-anchor="middle">S</text><rect x="312" y="55" width="20" height="20" rx="3" class="b"/><text x="270" y="100" class="s" text-anchor="middle">same as last time?</text><text x="270" y="128" class="t" text-anchor="middle">nothing to check ✗</text><text x="180" y="172" class="t" text-anchor="middle">If only my impression decides, “right” and</text><text x="180" y="188" class="t" text-anchor="middle">“seems right” collapse into one.</text></svg>
