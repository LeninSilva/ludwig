<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="A chess king is defined by how it may move, as a word is by the rules for its use" xmlns="http://www.w3.org/2000/svg"><title>A chess king is defined by how it may move, as a word is by the rules for its use</title><defs><marker id="grammar-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="30" y="30" width="30" height="30" rx="0" class="b"/><rect x="60" y="30" width="30" height="30" rx="0" class="bc"/><rect x="90" y="30" width="30" height="30" rx="0" class="b"/><rect x="120" y="30" width="30" height="30" rx="0" class="bc"/><rect x="30" y="60" width="30" height="30" rx="0" class="bc"/><rect x="60" y="60" width="30" height="30" rx="0" class="b"/><rect x="90" y="60" width="30" height="30" rx="0" class="bc"/><rect x="120" y="60" width="30" height="30" rx="0" class="b"/><rect x="30" y="90" width="30" height="30" rx="0" class="b"/><rect x="60" y="90" width="30" height="30" rx="0" class="bc"/><rect x="90" y="90" width="30" height="30" rx="0" class="b"/><rect x="120" y="90" width="30" height="30" rx="0" class="bc"/><rect x="30" y="120" width="30" height="30" rx="0" class="bc"/><rect x="60" y="120" width="30" height="30" rx="0" class="b"/><rect x="90" y="120" width="30" height="30" rx="0" class="bc"/><rect x="120" y="120" width="30" height="30" rx="0" class="b"/><text x="75" y="82" class="big" text-anchor="middle">♔</text><line x1="61.5" y1="75.0" x2="46.5" y2="75.0" class="p" marker-end="url(#grammar-ar)"/><line x1="88.5" y1="75.0" x2="103.5" y2="75.0" class="p" marker-end="url(#grammar-ar)"/><line x1="75.0" y1="61.5" x2="75.0" y2="46.5" class="p" marker-end="url(#grammar-ar)"/><line x1="75.0" y1="88.5" x2="75.0" y2="103.5" class="p" marker-end="url(#grammar-ar)"/><line x1="88.5" y1="88.5" x2="103.5" y2="103.5" class="p" marker-end="url(#grammar-ar)"/><text x="240" y="60" class="t" text-anchor="middle">What makes this</text><text x="240" y="76" class="t" text-anchor="middle">the king?</text><text x="240" y="104" class="s" text-anchor="middle">Not its shape:</text><text x="240" y="118" class="s" text-anchor="middle">the rules for moving it.</text><text x="180" y="172" class="t" text-anchor="middle">A word’s grammar = the rules for using it.</text></svg>
