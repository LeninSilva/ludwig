<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="A law describing regularities is different from a force compelling an action" xmlns="http://www.w3.org/2000/svg"><title>A law describing regularities is different from a force compelling an action</title><defs><marker id="will-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="22" class="lab" text-anchor="middle">A REGULARITY</text><text x="270" y="22" class="lab" text-anchor="middle">A COMPULSION</text><rect x="20" y="35" width="140" height="100" rx="8" class="b"/><circle cx="40" cy="85" r="5" class="fp"/><circle cx="62" cy="73" r="5" class="fp"/><circle cx="84" cy="85" r="5" class="fp"/><circle cx="106" cy="73" r="5" class="fp"/><circle cx="128" cy="85" r="5" class="fp"/><circle cx="150" cy="73" r="5" class="fp"/><text x="90" y="122" class="s" text-anchor="middle">what tends to happen</text><rect x="200" y="35" width="140" height="100" rx="8" class="bc"/><circle cx="240" cy="75" r="9" class="k"/><line x1="240" y1="84" x2="240" y2="115" class="k"/><circle cx="300" cy="75" r="9" class="k"/><line x1="300" y1="84" x2="300" y2="115" class="k"/><line x1="250" y1="95" x2="288" y2="95" class="c" marker-end="url(#will-ar)"/><text x="270" y="122" class="s" text-anchor="middle">someone forces you</text><text x="180" y="162" class="t" text-anchor="middle">Being predictable is not the same as being pushed.</text></svg>
