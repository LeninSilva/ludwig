<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="After 1000 the teacher expects 1002 but the pupil writes 1004: the rule needs a practice" xmlns="http://www.w3.org/2000/svg"><title>After 1000 the teacher expects 1002 but the pupil writes 1004: the rule needs a practice</title><defs><marker id="going-on-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="180" y="22" class="lab" text-anchor="middle">Rule given: “add 2”</text><rect x="10" y="50" width="40" height="30" rx="8" class="b"/><text x="30.0" y="69.5" class="t" text-anchor="middle">996</text><rect x="60" y="50" width="40" height="30" rx="8" class="b"/><text x="80.0" y="69.5" class="t" text-anchor="middle">998</text><rect x="110" y="50" width="40" height="30" rx="8" class="b"/><text x="130.0" y="69.5" class="t" text-anchor="middle">1000</text><line x1="50" y1="65" x2="60" y2="65" class="k" marker-end="url(#going-on-ar)"/><line x1="100" y1="65" x2="110" y2="65" class="k" marker-end="url(#going-on-ar)"/><line x1="200" y1="65" x2="255" y2="40" class="p" marker-end="url(#going-on-ar)"/><line x1="200" y1="65" x2="255" y2="100" class="c" marker-end="url(#going-on-ar)"/><rect x="260" y="25" width="70" height="30" rx="8" class="b"/><text x="295.0" y="44.5" class="tp" text-anchor="middle">1002</text><rect x="260" y="85" width="70" height="30" rx="8" class="bc"/><text x="295.0" y="104.5" class="tc" text-anchor="middle">1004</text><text x="295" y="70" class="s" text-anchor="middle">teacher</text><text x="295" y="130" class="s" text-anchor="middle">pupil</text><text x="180" y="160" class="t" text-anchor="middle">The formula alone does not stop the pupil.</text><text x="180" y="178" class="s" text-anchor="middle">Shared training and practice fix what “correct” is.</text></svg>
