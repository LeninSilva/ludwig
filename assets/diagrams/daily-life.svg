<svg class="dg" viewBox="0 0 360 220" role="img" aria-label="A daily cycle: notice a word, look at its use, compare cases, decide while staying open" xmlns="http://www.w3.org/2000/svg"><title>A daily cycle: notice a word, look at its use, compare cases, decide while staying open</title><defs><marker id="daily-life-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="118" y="15" width="124" height="40" rx="8" class="b"/><text x="180.0" y="32.0" class="t" text-anchor="middle">Notice a word</text><text x="180.0" y="47.0" class="t" text-anchor="middle">doing too much</text><rect x="238" y="90" width="124" height="40" rx="8" class="b"/><text x="300.0" y="107.0" class="t" text-anchor="middle">Look at how</text><text x="300.0" y="122.0" class="t" text-anchor="middle">it is used here</text><rect x="118" y="165" width="124" height="40" rx="8" class="b"/><text x="180.0" y="182.0" class="t" text-anchor="middle">Compare</text><text x="180.0" y="197.0" class="t" text-anchor="middle">cases</text><rect x="-2" y="90" width="124" height="40" rx="8" class="b"/><text x="60.0" y="107.0" class="t" text-anchor="middle">Decide, stay open</text><text x="60.0" y="122.0" class="t" text-anchor="middle">to correction</text><line x1="240" y1="45" x2="290" y2="88" class="k" marker-end="url(#daily-life-ar)"/><line x1="290" y1="132" x2="240" y2="175" class="k" marker-end="url(#daily-life-ar)"/><line x1="120" y1="175" x2="70" y2="132" class="k" marker-end="url(#daily-life-ar)"/><line x1="70" y1="88" x2="120" y2="45" class="k" marker-end="url(#daily-life-ar)"/><text x="180" y="115" class="tc" text-anchor="middle">a daily habit</text></svg>
