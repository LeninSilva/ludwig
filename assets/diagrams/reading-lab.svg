<svg class="dg" viewBox="0 0 360 230" role="img" aria-label="Five steps to read a remark closely" xmlns="http://www.w3.org/2000/svg"><title>Five steps to read a remark closely</title><defs><marker id="reading-lab-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><circle cx="30" cy="28" r="15" class="fc"/><text x="30" y="33" class="tw" text-anchor="middle">1</text><text x="58" y="26" class="tp" text-anchor="start">Locate it</text><text x="58" y="41" class="s" text-anchor="start">which edition, which §</text><line x1="30" y1="44" x2="30" y2="57" class="k"/><circle cx="30" cy="72" r="15" class="fc"/><text x="30" y="77" class="tw" text-anchor="middle">2</text><text x="58" y="70" class="tp" text-anchor="start">Hear the voices</text><text x="58" y="85" class="s" text-anchor="start">who speaks? who objects?</text><line x1="30" y1="88" x2="30" y2="101" class="k"/><circle cx="30" cy="116" r="15" class="fc"/><text x="30" y="121" class="tw" text-anchor="middle">3</text><text x="58" y="114" class="tp" text-anchor="start">Find the target</text><text x="58" y="129" class="s" text-anchor="start">which picture is questioned?</text><line x1="30" y1="132" x2="30" y2="145" class="k"/><circle cx="30" cy="160" r="15" class="fc"/><text x="30" y="165" class="tw" text-anchor="middle">4</text><text x="58" y="158" class="tp" text-anchor="start">Keep the hedges</text><text x="58" y="173" class="s" text-anchor="start">“for a large class of cases”</text><line x1="30" y1="176" x2="30" y2="189" class="k"/><circle cx="30" cy="204" r="15" class="fc"/><text x="30" y="209" class="tw" text-anchor="middle">5</text><text x="58" y="202" class="tp" text-anchor="start">Argue back</text><text x="58" y="217" class="s" text-anchor="start">your own view, with reasons</text></svg>
