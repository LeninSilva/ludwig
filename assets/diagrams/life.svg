<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="Words rest on a ground of shared human activities" xmlns="http://www.w3.org/2000/svg"><title>Words rest on a ground of shared human activities</title><defs><marker id="life-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="80" y="20" width="200" height="40" rx="16" class="bc"/><text x="180.0" y="44.5" class="tc" text-anchor="middle">“Good morning”  “3 apples”</text><text x="195" y="82" class="s" text-anchor="start">words…</text><rect x="20" y="95" width="320" height="60" rx="8" class="b"/><text x="180" y="118" class="tp" text-anchor="middle">greeting · trading · counting · caring</text><text x="180" y="138" class="tp" text-anchor="middle">eating · playing · mourning · promising</text><line x1="180" y1="62" x2="180" y2="92" class="k" marker-end="url(#life-ar)"/><text x="180" y="182" class="t" text-anchor="middle">…rest on shared ways of living.</text></svg>
