<svg class="dg" viewBox="0 0 360 190" role="img" aria-label="A list of things versus a fact: things arranged in a particular way" xmlns="http://www.w3.org/2000/svg"><title>A list of things versus a fact: things arranged in a particular way</title><defs><marker id="facts-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="22" class="lab" text-anchor="middle">THINGS</text><text x="270" y="22" class="lab" text-anchor="middle">A FACT</text><rect x="20" y="35" width="140" height="95" rx="8" class="b"/><path d="M45 95h40v20h-40z" class="fp"/><text x="65" y="140" class="s" text-anchor="middle"></text><circle cx="120" cy="70" r="13" class="fc"/><path d="M100 60l12-20 12 20z" class="k"/><text x="90" y="148" class="s" text-anchor="middle">book, cup, lamp…</text><rect x="200" y="35" width="140" height="95" rx="8" class="b"/><path d="M240 100h60v20h-60z" class="fp"/><circle cx="270" cy="86" r="13" class="fc"/><text x="270" y="148" class="s" text-anchor="middle">the cup is ON the book</text><line x1="162" y1="82" x2="196" y2="82" class="k" marker-end="url(#facts-ar)"/><text x="180" y="176" class="t" text-anchor="middle">The world is how things stand, not a list of things.</text></svg>
