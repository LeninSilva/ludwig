<svg class="dg" viewBox="0 0 360 210" role="img" aria-label="One word, Check!, doing different jobs in chess, a restaurant, a clinic and a to-do list" xmlns="http://www.w3.org/2000/svg"><title>One word, Check!, doing different jobs in chess, a restaurant, a clinic and a to-do list</title><defs><marker id="meaning-use-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="130" y="85" width="100" height="40" rx="8" class="bc"/><text x="180.0" y="109.5" class="tc" text-anchor="middle">“Check!”</text><rect x="10" y="20" width="110" height="36" rx="8" class="b"/><text x="65.0" y="35.0" class="t" text-anchor="middle">Chess</text><text x="65.0" y="50.0" class="t" text-anchor="middle">a warning move</text><rect x="240" y="20" width="110" height="36" rx="8" class="b"/><text x="295.0" y="35.0" class="t" text-anchor="middle">Restaurant</text><text x="295.0" y="50.0" class="t" text-anchor="middle">the bill, please</text><rect x="10" y="160" width="110" height="36" rx="8" class="b"/><text x="65.0" y="175.0" class="t" text-anchor="middle">Doctor</text><text x="65.0" y="190.0" class="t" text-anchor="middle">examine this</text><rect x="240" y="160" width="110" height="36" rx="8" class="b"/><text x="295.0" y="175.0" class="t" text-anchor="middle">To-do list</text><text x="295.0" y="190.0" class="t" text-anchor="middle">it is done</text><line x1="150" y1="85" x2="100" y2="58" class="k" marker-end="url(#meaning-use-ar)"/><line x1="210" y1="85" x2="260" y2="58" class="k" marker-end="url(#meaning-use-ar)"/><line x1="150" y1="125" x2="100" y2="158" class="k" marker-end="url(#meaning-use-ar)"/><line x1="210" y1="125" x2="260" y2="158" class="k" marker-end="url(#meaning-use-ar)"/></svg>
