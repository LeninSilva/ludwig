<svg class="dg" viewBox="0 0 360 210" role="img" aria-label="Two buttons on a table arranged like two cars at a junction: a model that can be true or false" xmlns="http://www.w3.org/2000/svg"><title>Two buttons on a table arranged like two cars at a junction: a model that can be true or false</title><defs><marker id="picture-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="22" class="lab" text-anchor="middle">MODEL</text><text x="270" y="22" class="lab" text-anchor="middle">REALITY</text><rect x="20" y="35" width="140" height="100" rx="8" class="bc"/><circle cx="65" cy="70" r="9" class="fc"/><circle cx="115" cy="100" r="9" class="fp"/><text x="65" y="92" class="s" text-anchor="middle">button 1</text><text x="115" y="122" class="s" text-anchor="middle">button 2</text><rect x="200" y="35" width="140" height="100" rx="8" class="b"/><path d="M240 62h22v14h-22z" class="fc"/><path d="M290 92h22v14h-22z" class="fp"/><line x1="270" y1="40" x2="270" y2="130" class="k" stroke-dasharray="4 4"/><line x1="205" y1="85" x2="335" y2="85" class="k" stroke-dasharray="4 4"/><text x="251" y="88" class="s" text-anchor="middle"></text><line x1="74" y1="70" x2="238" y2="69" class="p" stroke-dasharray="4 4" marker-end="url(#picture-ar)"/><line x1="124" y1="100" x2="288" y2="99" class="p" stroke-dasharray="4 4" marker-end="url(#picture-ar)"/><text x="180" y="160" class="t" text-anchor="middle">Each part stands for a thing.</text><text x="180" y="180" class="s" text-anchor="middle">The arrangement says how things are,</text><text x="180" y="195" class="s" text-anchor="middle">so the model can be true or false.</text></svg>
