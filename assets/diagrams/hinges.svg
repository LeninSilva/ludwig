<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="A door of questions turning on hinges of certainties that are not themselves questioned" xmlns="http://www.w3.org/2000/svg"><title>A door of questions turning on hinges of certainties that are not themselves questioned</title><defs><marker id="hinges-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><path d="M70 25v150" class="k"/><rect x="75" y="25" width="160" height="150" rx="3" class="b"/><rect x="62" y="45" width="16" height="26" rx="3" class="fc"/><rect x="62" y="130" width="16" height="26" rx="3" class="fc"/><text x="155" y="95" class="tp" text-anchor="middle">questions,</text><text x="155" y="112" class="tp" text-anchor="middle">checking, doubts</text><circle cx="215" cy="100" r="5" class="k"/><text x="250" y="50" class="s" text-anchor="start">“I have hands.”</text><text x="250" y="140" class="s" text-anchor="start">“The earth is old.”</text><line x1="248" y1="46" x2="82" y2="58" class="c" stroke-dasharray="4 4" marker-end="url(#hinges-ar)"/><line x1="248" y1="136" x2="82" y2="143" class="c" stroke-dasharray="4 4" marker-end="url(#hinges-ar)"/><text x="180" y="194" class="t" text-anchor="middle">The door moves only because the hinges stay put.</text></svg>
