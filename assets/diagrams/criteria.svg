<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="A criterion is what counts as rain; evidence such as wet streets only makes rain likely" xmlns="http://www.w3.org/2000/svg"><title>A criterion is what counts as rain; evidence such as wet streets only makes rain likely</title><defs><marker id="criteria-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="22" class="lab" text-anchor="middle">CRITERION</text><text x="270" y="22" class="lab" text-anchor="middle">EVIDENCE</text><rect x="20" y="35" width="140" height="95" rx="8" class="b"/><line x1="45" y1="50" x2="39" y2="70" class="p"/><line x1="53" y1="80" x2="47" y2="100" class="p"/><line x1="65" y1="50" x2="59" y2="70" class="p"/><line x1="73" y1="80" x2="67" y2="100" class="p"/><line x1="85" y1="50" x2="79" y2="70" class="p"/><line x1="93" y1="80" x2="87" y2="100" class="p"/><line x1="105" y1="50" x2="99" y2="70" class="p"/><line x1="113" y1="80" x2="107" y2="100" class="p"/><line x1="125" y1="50" x2="119" y2="70" class="p"/><line x1="133" y1="80" x2="127" y2="100" class="p"/><text x="90" y="120" class="s" text-anchor="middle">rain falling</text><rect x="200" y="35" width="140" height="95" rx="8" class="bc"/><path d="M215 105h110" class="k"/><path d="M235 102c10-6 25-6 35 0M280 102c10-6 25-6 35 0" class="p"/><text x="270" y="120" class="s" text-anchor="middle">wet streets, puddles</text><text x="90" y="150" class="tp" text-anchor="middle">what COUNTS as rain</text><text x="270" y="150" class="tc" text-anchor="middle">what makes rain LIKELY</text><text x="180" y="182" class="s" text-anchor="middle">Sprinklers can wet the street. Evidence can mislead.</text></svg>
