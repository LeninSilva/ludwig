<svg class="dg" viewBox="0 0 360 210" role="img" aria-label="A factual sentence is true in some cases; a logical truth is true in every case and says nothing about the weather" xmlns="http://www.w3.org/2000/svg"><title>A factual sentence is true in some cases; a logical truth is true in every case and says nothing about the weather</title><defs><marker id="logic-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="180" y="20" class="lab" text-anchor="middle">Does the sentence tell you about the weather?</text><text x="90" y="48" class="t" text-anchor="middle">“It is raining.”</text><text x="270" y="48" class="t" text-anchor="middle">“It is raining</text><text x="270" y="63" class="t" text-anchor="middle">or it is not.”</text><rect x="30" y="78" width="55" height="55" rx="8" class="b"/><rect x="95" y="78" width="55" height="55" rx="8" class="bc"/><path d="M45 100h25M42 108l-4 10M54 108l-4 10M66 108l-4 10" class="p"/><circle cx="122" cy="100" r="9" class="c"/><text x="57" y="150" class="t" text-anchor="middle">rain: ✓</text><text x="122" y="150" class="t" text-anchor="middle">sun: ✗</text><rect x="210" y="78" width="55" height="55" rx="8" class="b"/><rect x="275" y="78" width="55" height="55" rx="8" class="bc"/><path d="M225 100h25M222 108l-4 10M234 108l-4 10M246 108l-4 10" class="p"/><circle cx="302" cy="100" r="9" class="c"/><text x="237" y="150" class="t" text-anchor="middle">rain: ✓</text><text x="302" y="150" class="t" text-anchor="middle">sun: ✓</text><text x="90" y="180" class="tp" text-anchor="middle">Rules some weather out</text><text x="90" y="195" class="s" text-anchor="middle">→ gives information</text><text x="270" y="180" class="tc" text-anchor="middle">True whatever happens</text><text x="270" y="195" class="s" text-anchor="middle">→ shows logic, says nothing</text></svg>
