<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="Kissing a photo is not a failed prediction but an expression of love" xmlns="http://www.w3.org/2000/svg"><title>Kissing a photo is not a failed prediction but an expression of love</title><defs><marker id="ritual-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="140" y="30" width="80" height="70" rx="4" class="b"/><circle cx="180" cy="57" r="12" class="p"/><path d="M160 95c5-20 35-20 40 0" class="p"/><text x="180" y="118" class="s" text-anchor="middle">kissing a photo of</text><text x="180" y="132" class="s" text-anchor="middle">someone you love</text><rect x="5" y="35" width="125" height="60" rx="8" class="bc"/><text x="67.5" y="54.5" class="tc" text-anchor="middle">“This will</text><text x="67.5" y="69.5" class="tc" text-anchor="middle">reach her.”</text><text x="67.5" y="84.5" class="tc" text-anchor="middle">(bad science)</text><line x1="10" y1="40" x2="125" y2="90" class="c"/><rect x="230" y="35" width="125" height="60" rx="8" class="b"/><text x="292.5" y="62.0" class="tp" text-anchor="middle">“I love her.”</text><text x="292.5" y="77.0" class="tp" text-anchor="middle">(expression)</text><text x="180" y="172" class="t" text-anchor="middle">Ask what an act means in a life,</text><text x="180" y="188" class="t" text-anchor="middle">not only whether it “works”.</text></svg>
