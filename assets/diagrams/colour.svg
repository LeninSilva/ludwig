<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="A colour puzzle can be a question for science or a question about our concepts" xmlns="http://www.w3.org/2000/svg"><title>A colour puzzle can be a question for science or a question about our concepts</title><defs><marker id="colour-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="140" y="20" width="80" height="50" rx="8" class="fc"/><text x="180" y="90" class="s" text-anchor="middle">a colour puzzle</text><line x1="150" y1="72" x2="80" y2="115" class="p" marker-end="url(#colour-ar)"/><line x1="210" y1="72" x2="280" y2="115" class="c" marker-end="url(#colour-ar)"/><rect x="10" y="118" width="150" height="50" rx="8" class="b"/><text x="85.0" y="140.0" class="tp" text-anchor="middle">Why does it look</text><text x="85.0" y="155.0" class="tp" text-anchor="middle">lighter here?</text><rect x="200" y="118" width="150" height="50" rx="8" class="bc"/><text x="275.0" y="140.0" class="tc" text-anchor="middle">Could there be a</text><text x="275.0" y="155.0" class="tc" text-anchor="middle">transparent white?</text><text x="85" y="186" class="s" text-anchor="middle">ask physics: light, eyes</text><text x="275" y="186" class="s" text-anchor="middle">ask how we use colour words</text></svg>
