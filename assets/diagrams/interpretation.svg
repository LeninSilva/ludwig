<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="Interpreting a signpost with another interpretation never ends; following it in practice does" xmlns="http://www.w3.org/2000/svg"><title>Interpreting a signpost with another interpretation never ends; following it in practice does</title><defs><marker id="interpretation-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><path d="M50 160V40M50 50h60l15 12-15 12H50" class="k"/><text x="80" y="66" class="s" text-anchor="middle">rule</text><text x="160" y="40" class="tc" text-anchor="start">→ interpretation → interpretation → …</text><line x1="160" y1="33" x2="345" y2="47" class="c"/><text x="160" y="60" class="s" text-anchor="start">never reaches an action</text><line x1="60" y1="120" x2="150" y2="120" class="p" marker-end="url(#interpretation-ar)"/><rect x="155" y="100" width="170" height="40" rx="8" class="b"/><text x="240.0" y="124.5" class="tp" text-anchor="middle">Follow it: walk the path</text><text x="240" y="160" class="t" text-anchor="middle">Understanding shows in what we do.</text><text x="180" y="188" class="s" text-anchor="middle">“Explanations come to an end somewhere.”</text></svg>
