<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="A working doubt can be checked; an idle doubt has no test that could settle it" xmlns="http://www.w3.org/2000/svg"><title>A working doubt can be checked; an idle doubt has no test that could settle it</title><defs><marker id="doubt-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="22" class="lab" text-anchor="middle">WORKING DOUBT</text><text x="270" y="22" class="lab" text-anchor="middle">IDLE DOUBT</text><rect x="20" y="35" width="140" height="110" rx="8" class="b"/><text x="90" y="65" class="tp" text-anchor="middle">“Did I lock</text><text x="90" y="80" class="tp" text-anchor="middle">the door?”</text><rect x="200" y="35" width="140" height="110" rx="8" class="bc"/><text x="270" y="65" class="tc" text-anchor="middle">“Do I really</text><text x="270" y="80" class="tc" text-anchor="middle">have hands?”</text><text x="90" y="115" class="t" text-anchor="middle">go and check ✓</text><text x="90" y="132" class="s" text-anchor="middle">clear way to settle it</text><text x="270" y="115" class="t" text-anchor="middle">check with… what? ✗</text><text x="270" y="132" class="s" text-anchor="middle">nothing is surer</text><text x="180" y="178" class="t" text-anchor="middle">A real doubt needs a reason and a way to check.</text></svg>
