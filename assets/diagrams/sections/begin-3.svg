<svg class="dg" viewBox="0 0 360 200" role="img" aria-label="State the question before asking evidence to answer it" xmlns="http://www.w3.org/2000/svg"><title>State the question before asking evidence to answer it</title><defs><marker id="begin-3-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="60" y="10" width="240" height="39" rx="8" class="bc"/><text x="180.0" y="34.0" class="tc" text-anchor="middle">A question about a feeling</text><line x1="150" y1="51" x2="90" y2="81" class="p" marker-end="url(#begin-3-ar)"/><line x1="210" y1="51" x2="270" y2="81" class="c" marker-end="url(#begin-3-ar)"/><rect x="15" y="83" width="150" height="69" rx="8" class="b"/><text x="90.0" y="107.0" class="tp" text-anchor="middle">Facts: what causes</text><text x="90.0" y="122.0" class="tp" text-anchor="middle">it? (a brain</text><text x="90.0" y="137.0" class="tp" text-anchor="middle">experiment)</text><rect x="195" y="83" width="150" height="69" rx="8" class="b"/><text x="270.0" y="114.5" class="t" text-anchor="middle">Concept: reporting vs</text><text x="270.0" y="129.5" class="t" text-anchor="middle">expressing it</text><text x="180" y="178" class="s" text-anchor="middle">State the question before asking evidence to answer</text><text x="180" y="193" class="s" text-anchor="middle">it</text></svg>
