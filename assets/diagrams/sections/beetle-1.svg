<svg class="dg" viewBox="0 0 360 125" role="img" aria-label="Not “nothing is in the box”" xmlns="http://www.w3.org/2000/svg"><title>Not “nothing is in the box”</title><defs><marker id="beetle-1-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="18" class="lab" text-anchor="middle">DROPS OUT</text><text x="270" y="18" class="lab" text-anchor="middle">STAYS</text><rect x="15" y="28" width="150" height="60" rx="8" class="b"/><text x="90.0" y="55.0" class="tp" text-anchor="middle">the hidden object as</text><text x="90.0" y="70.0" class="tp" text-anchor="middle">the source of meaning</text><rect x="195" y="28" width="150" height="60" rx="8" class="bc"/><text x="270.0" y="55.0" class="tc" text-anchor="middle">pain itself,</text><text x="270.0" y="70.0" class="tc" text-anchor="middle">experience</text><text x="180" y="62.0" class="s" text-anchor="middle">vs</text><text x="180" y="112" class="s" text-anchor="middle">Not “nothing is in the box”</text></svg>
