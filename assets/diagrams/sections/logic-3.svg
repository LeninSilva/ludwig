<svg class="dg" viewBox="0 0 360 141" role="img" aria-label="Logic shows what follows, not which premise is true" xmlns="http://www.w3.org/2000/svg"><title>Logic shows what follows, not which premise is true</title><defs><marker id="logic-3-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="15.0" y="15" width="100.66666666666667" height="71" rx="8" class="b"/><text x="65.33333333333334" y="40.0" class="t" text-anchor="middle">“It will</text><text x="65.33333333333334" y="55.0" class="t" text-anchor="middle">succeed or it</text><text x="65.33333333333334" y="70.0" class="t" text-anchor="middle">will not”</text><line x1="116.66666666666667" y1="50.5" x2="128.66666666666669" y2="50.5" class="k" marker-end="url(#logic-3-ar)"/><rect x="129.66666666666669" y="15" width="100.66666666666667" height="71" rx="8" class="b"/><text x="180.00000000000003" y="47.5" class="t" text-anchor="middle">exhausts the</text><text x="180.00000000000003" y="62.5" class="t" text-anchor="middle">options</text><line x1="231.33333333333337" y1="50.5" x2="243.33333333333337" y2="50.5" class="k" marker-end="url(#logic-3-ar)"/><rect x="244.33333333333334" y="15" width="100.66666666666667" height="71" rx="8" class="bc"/><text x="294.6666666666667" y="40.0" class="tc" text-anchor="middle">tells you</text><text x="294.6666666666667" y="55.0" class="tc" text-anchor="middle">nothing about</text><text x="294.6666666666667" y="70.0" class="tc" text-anchor="middle">which</text><text x="180" y="112" class="s" text-anchor="middle">Logic shows what follows, not which premise is true</text></svg>
