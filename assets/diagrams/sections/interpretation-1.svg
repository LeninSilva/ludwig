<svg class="dg" viewBox="0 0 360 140" role="img" aria-label="Quoting only the first half reverses the lesson" xmlns="http://www.w3.org/2000/svg"><title>Quoting only the first half reverses the lesson</title><defs><marker id="interpretation-1-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="18" class="lab" text-anchor="middle">THE PARADOX (§201)</text><text x="270" y="18" class="lab" text-anchor="middle">THE REPLY</text><rect x="15" y="28" width="150" height="75" rx="8" class="b"/><text x="90.0" y="62.5" class="tp" text-anchor="middle">any action can accord</text><text x="90.0" y="77.5" class="tp" text-anchor="middle">with a rule</text><rect x="195" y="28" width="150" height="75" rx="8" class="bc"/><text x="270.0" y="55.0" class="tc" text-anchor="middle">then there is no</text><text x="270.0" y="70.0" class="tc" text-anchor="middle">conflict either — a</text><text x="270.0" y="85.0" class="tc" text-anchor="middle">misunderstanding</text><text x="180" y="69.5" class="s" text-anchor="middle">vs</text><text x="180" y="127" class="s" text-anchor="middle">Quoting only the first half reverses the lesson</text></svg>
