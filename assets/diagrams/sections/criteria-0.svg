<svg class="dg" viewBox="0 0 360 125" role="img" aria-label="One sign can play either role" xmlns="http://www.w3.org/2000/svg"><title>One sign can play either role</title><defs><marker id="criteria-0-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><text x="90" y="18" class="lab" text-anchor="middle">EVIDENCE</text><text x="270" y="18" class="lab" text-anchor="middle">CRITERION</text><rect x="15" y="28" width="150" height="60" rx="8" class="b"/><text x="90.0" y="55.0" class="tp" text-anchor="middle">a thermometer reading</text><text x="90.0" y="70.0" class="tp" text-anchor="middle">supports “fever”</text><rect x="195" y="28" width="150" height="60" rx="8" class="bc"/><text x="270.0" y="55.0" class="tc" text-anchor="middle">what counts as a</text><text x="270.0" y="70.0" class="tc" text-anchor="middle">valid measurement</text><text x="180" y="62.0" class="s" text-anchor="middle">vs</text><text x="180" y="112" class="s" text-anchor="middle">One sign can play either role</text></svg>
