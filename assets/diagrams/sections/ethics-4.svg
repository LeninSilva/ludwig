<svg class="dg" viewBox="0 0 360 225" role="img" aria-label="The lecture opens a problem; it doesn’t close thought" xmlns="http://www.w3.org/2000/svg"><title>The lecture opens a problem; it doesn’t close thought</title><defs><marker id="ethics-4-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="70" y="10" width="220" height="43" rx="16" class="bc"/><text x="180.0" y="36.0" class="tc" text-anchor="middle">What not to conclude</text><line x1="180" y1="53" x2="94.5" y2="71" class="k" stroke-dasharray="4 4"/><line x1="180" y1="53" x2="265.5" y2="71" class="k" stroke-dasharray="4 4"/><rect x="8" y="65" width="344" height="120" rx="12" class="grp"/><rect x="15.0" y="71" width="159.0" height="48" rx="8" class="b"/><text x="94.5" y="92.0" class="t" text-anchor="middle">ethics is private</text><text x="94.5" y="107.0" class="t" text-anchor="middle">feeling</text><rect x="186.0" y="71" width="159.0" height="48" rx="8" class="b"/><text x="265.5" y="99.5" class="t" text-anchor="middle">reasons are irrelevant</text><rect x="15.0" y="131" width="159.0" height="48" rx="8" class="b"/><text x="94.5" y="152.0" class="t" text-anchor="middle">disagreement is</text><text x="94.5" y="167.0" class="t" text-anchor="middle">pointless</text><text x="180" y="207" class="s" text-anchor="middle">The lecture opens a problem; it doesn’t close</text><text x="180" y="222" class="s" text-anchor="middle">thought</text></svg>
