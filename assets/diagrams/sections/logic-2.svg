<svg class="dg" viewBox="0 0 360 180" role="img" aria-label="“and”, “not” organise propositions; they name no objects" xmlns="http://www.w3.org/2000/svg"><title>“and”, “not” organise propositions; they name no objects</title><defs><marker id="logic-2-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="43" y="12" width="274" height="34" rx="8" class="b"/><text x="180.0" y="33.5" class="tp" text-anchor="middle">Contradiction: never true</text><rect x="29" y="54" width="302" height="34" rx="8" class="b"/><text x="180.0" y="75.5" class="tp" text-anchor="middle">Factual pictures: true or false</text><rect x="15" y="96" width="330" height="34" rx="8" class="bc"/><text x="180.0" y="117.5" class="tc" text-anchor="middle">Tautology: always true</text><text x="180" y="156" class="s" text-anchor="middle">“and”, “not” organise propositions; they name no</text><text x="180" y="171" class="s" text-anchor="middle">objects</text></svg>
