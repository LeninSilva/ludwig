<svg class="dg" viewBox="0 0 360 156" role="img" aria-label="Understanding a practice ≠ approving it" xmlns="http://www.w3.org/2000/svg"><title>Understanding a practice ≠ approving it</title><defs><marker id="life-3-ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" class="mk"/></marker></defs><rect x="15.0" y="15" width="100.66666666666667" height="86" rx="8" class="b"/><text x="65.33333333333334" y="40.0" class="t" text-anchor="middle">A newcomer</text><text x="65.33333333333334" y="55.0" class="t" text-anchor="middle">misses an</text><text x="65.33333333333334" y="70.0" class="t" text-anchor="middle">“obvious”</text><text x="65.33333333333334" y="85.0" class="t" text-anchor="middle">rule</text><line x1="116.66666666666667" y1="58.0" x2="128.66666666666669" y2="58.0" class="k" marker-end="url(#life-3-ar)"/><rect x="129.66666666666669" y="15" width="100.66666666666667" height="86" rx="8" class="b"/><text x="180.00000000000003" y="55.0" class="t" text-anchor="middle">ask what they</text><text x="180.00000000000003" y="70.0" class="t" text-anchor="middle">were taught</text><line x1="231.33333333333337" y1="58.0" x2="243.33333333333337" y2="58.0" class="k" marker-end="url(#life-3-ar)"/><rect x="244.33333333333334" y="15" width="100.66666666666667" height="86" rx="8" class="bc"/><text x="294.6666666666667" y="55.0" class="tc" text-anchor="middle">show, don’t</text><text x="294.6666666666667" y="70.0" class="tc" text-anchor="middle">judge</text><text x="180" y="127" class="s" text-anchor="middle">Understanding a practice ≠ approving it</text></svg>
