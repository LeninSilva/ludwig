name: Check Ludwig
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  reading-pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run check
      - uses: actions/upload-artifact@v4
        with:
          name: ludwig-web-app
          path: dist
